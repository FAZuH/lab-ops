[package]
name = "lab-ops_natmap"
version = "0.1.10"
edition = "2024"
description = "iptables NAT mapping daemon with CLI control over Unix socket"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
lab-ops_lab-lib = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
axum = { version = "0.7" }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json", "stream", "rustls-tls"] }
bollard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
comfy-table = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
tower-service = "0.3.3"
tower = "0.5.3"
clap_complete = { workspace = true }
tokio-stream = "0.1.18"
http-body-util = "0.1.3"
[lints.clippy]
uninlined_format_args = "warn"
new_without_default = "allow"
[dev-dependencies]
proptest = { workspace = true }
tracing-test = { workspace = true }
tempfile = { workspace = true }
