[package]
name = "auto-discover"
version = "0.1.0"
edition = "2024"
description = "Service discovery daemon with Consul registration and nginx config generation"

[features]
docker-tests = []

[dependencies]
lab-lib = { path = "../lab-lib" }
natmap = { path = "../natmap" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bollard = "0.21.0"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
get_if_addrs = "0.5.3"
color-eyre = "0.6"
regex = "1"

[dev-dependencies]
tracing-test = "0.2"
tempfile = "3"

[lints.clippy]
uninlined_format_args = "warn"
new_without_default = "allow"
