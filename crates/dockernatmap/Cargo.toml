[package]
name = "dockernatmap"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
bollard = "0.21.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
tower-service = "0.3.3"
tower = "0.5.3"
tokio-stream = "0.1.18"
http-body-util = "0.1.3"

[[bin]]
name = "dockernatmapd"
path = "src/bin/dockernatmapd.rs"

[[bin]]
name = "dockernatmap"
path = "src/bin/dockernatmap.rs"
