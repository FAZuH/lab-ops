[package]
name = "lab-ops_lab-lib"
version = "0.1.3"
edition = "2024"
description = "Shared types, port allocation, and Docker helpers for the lab-ops workspace"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bollard = "0.21.0"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6.3"
tokio = { version = "1", features = ["sync", "net"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints.clippy]
uninlined_format_args = "warn"
new_without_default = "allow"
