[package]
name = "lab-ops"
# Version will be updated by CI in `release` branch.
# Avoid modifying version manually or it will break CI


version = "0.1.15"


edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "Personal utility tools for my homelab"
license = "MIT"
repository = "https://github.com/FAZuH/lab-ops"
keywords = ["homelab", "docker", "iptables", "devops", "cli"]
categories = ["command-line-utilities", "network-programming", "virtualization"]

[features]
docker-tests = []

[workspace.package]
description = "Personal utility tools for my homelab"
license = "MIT"
authors = ["FAZuH <mail@fazuh.com>"]
repository = "https://github.com/FAZuH/lab-ops"

[workspace]
members = ["crates/natmap", "crates/auto-discover", "crates/lab-lib"]

[dependencies]
regex = "1.12.3"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
bollard = "0.21.0"
color-eyre = "0.6.5"
comfy-table = "7.2.2"
tokio = { version = "1.52.2", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lab-lib = { path = "./crates/lab-lib" }
natmap = { path = "./crates/natmap" }
auto-discover = { path = "./crates/auto-discover" }

[lints.clippy]
uninlined_format_args = "warn"
new_without_default = "allow"
