[package]
name = "lab-ops"
# Version will be updated by CI in `release` branch.
# Avoid modifying version manually or it will break CI


version = "0.1.28"


edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "Personal utility tools for my homelab"
license = "MIT"
repository = "https://github.com/FAZuH/lab-ops"
keywords = ["homelab", "docker", "iptables", "devops", "cli"]
categories = ["command-line-utilities", "network-programming", "virtualization"]

[features]
docker-tests = []

[[test]]
name = "auto_discover"
path = "tests/auto_discover/mod.rs"

[workspace.package]
description = "Personal utility tools for my homelab"
license = "MIT"
authors = ["FAZuH <mail@fazuh.com>"]
repository = "https://github.com/FAZuH/lab-ops"

[workspace]
members = ["crates/natmap", "crates/auto-discover", "crates/lab-lib"]

[workspace.dependencies]
lab-ops_lab-lib = { path = "./crates/lab-lib", version = "0.1.5" }
lab-ops_natmap = { path = "./crates/natmap", version = "0.1.10" }
lab-ops_auto-discover = { path = "./crates/auto-discover", version = "0.1.9" }
proptest = "1"
bollard = "0.21.0"
tokio = "1"
color-eyre = "0.6.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
futures-util = "0.3"
reqwest = "0.12"
comfy-table = "7.2.2"
regex = "1"
tracing-test = "0.2"
tempfile = "3"

[dependencies]
regex = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
bollard = { workspace = true }
color-eyre = { workspace = true }
comfy-table = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing-subscriber = { workspace = true }
lab-ops_lab-lib = { workspace = true }
lab-ops_natmap = { workspace = true }
lab-ops_auto-discover = { workspace = true }

[lints.clippy]
uninlined_format_args = "warn"
new_without_default = "allow"
